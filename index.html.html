<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C++ and Maths: 91-day tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EEF1F5; --grid:#D9DFE8; --ink:#111B33; --ink2:#4A5775; --card:#FBFCFE; --line:#C3CCDB;
  --cpp:#2B47E8; --cpp-soft:#CCD4FA; --math:#0A7F72; --math-soft:#BFE6E0; --hl:#FFE45E; --on:#FFFFFF;
  --wkend:#E4E9F1; --warn:#B3261E;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1424; --grid:#19223A; --ink:#E8ECF6; --ink2:#9AA6C4; --card:#151D33; --line:#2B3657;
    --cpp:#7C93FF; --cpp-soft:#26335F; --math:#3CD0BC; --math-soft:#17413F; --hl:#7A6A12; --on:#0E1424;
    --wkend:#1B2540; --warn:#FF8A80;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1424; --grid:#19223A; --ink:#E8ECF6; --ink2:#9AA6C4; --card:#151D33; --line:#2B3657;
  --cpp:#7C93FF; --cpp-soft:#26335F; --math:#3CD0BC; --math-soft:#17413F; --hl:#7A6A12; --on:#0E1424;
  --wkend:#1B2540; --warn:#FF8A80;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; min-height:100%; color:var(--ink); font:16px/1.5 var(--body);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 56px}
h1{font:800 clamp(1.9rem,6vw,2.9rem)/1.02 var(--display);letter-spacing:-.03em;margin:0 0 10px}
h2{font:700 1.15rem/1.2 var(--display);margin:0 0 12px;letter-spacing:-.01em}
.sub{margin:0;color:var(--ink2);max-width:52ch}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cpp);outline-offset:2px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);margin:24px 0 20px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.stats div{padding:12px 12px 10px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:0}
.stats dt{font-size:.78rem;color:var(--ink2);margin:0}
.stats dd{margin:2px 0 0;font:800 1.45rem/1.1 var(--display);letter-spacing:-.02em}
.stats dd small{font:500 .78rem var(--body);color:var(--ink2);letter-spacing:0}
.stats .streak dd span{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
@media (max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.tabs button{background:none;border:0;padding:10px 16px;font:600 .95rem var(--body);color:var(--ink2);border-radius:6px 6px 0 0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
.card.main{border:2px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:20px}
.stack>*+*{margin-top:16px}

.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
.dayhead h2{font-size:clamp(1.5rem,5vw,2rem);margin:0}
.dayhead p{margin:2px 0 0;color:var(--ink2);font-size:.92rem}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border:1px solid var(--line);background:var(--paper);border-radius:6px;font-size:1.1rem}
.nav button:disabled{opacity:.35;cursor:default}
.chip{display:inline-block;border:1px solid var(--ink);border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:600;margin-right:6px}
.chip.hol{background:var(--hl);color:#111B33;border-color:#111B33}

.focus{margin:14px 0 18px;padding:12px 14px;border-left:4px solid var(--ink);background:var(--paper);border-radius:0 6px 6px 0;font-size:.92rem}
.focus p{margin:0}.focus p+p{margin-top:4px}
.tag{display:inline-block;font-weight:700;margin-right:6px}
.tag.cpp{color:var(--cpp)}.tag.math{color:var(--math)}

.prow{display:grid;grid-template-columns:3.6rem repeat(5,1fr);gap:8px;align-items:center}
.prow+.prow{margin-top:8px}
.plabel{font:700 .95rem var(--display)}
.plabel.cpp{color:var(--cpp)}.plabel.math{color:var(--math)}
.dot{aspect-ratio:1;max-width:64px;width:100%;border-radius:50%;border:2.5px solid currentColor;background:transparent;font:700 1rem var(--display);padding:0;transition:background .12s,color .12s,transform .12s}
.dot.cpp{color:var(--cpp)}.dot.math{color:var(--math)}
.dot.on.cpp{background:var(--cpp);color:var(--on)}
.dot.on.math{background:var(--math);color:var(--on)}
.dot:active{transform:scale(.92)}
.count{font:800 1.1rem var(--display);white-space:nowrap}
.count small{font:500 .85rem var(--body);color:var(--ink2)}
.ph{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.ph h2{margin:0}

.hours{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:10px}
.step button{width:42px;height:42px;border-radius:6px;border:1px solid var(--ink);background:var(--paper);font:700 1.3rem var(--display);line-height:1}
.step output{font:800 1.8rem var(--display);min-width:4.2ch;text-align:center;letter-spacing:-.02em}
.meter{position:relative;height:14px;border:1.5px solid var(--ink);border-radius:99px;background:var(--paper);margin:16px 0 4px;overflow:visible}
.meter .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--cpp-soft);transition:width .2s}
.meter .fill.ok{background:var(--cpp)}
.meter .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink)}
.mlabels{position:relative;height:1.3rem;font-size:.78rem;color:var(--ink2)}
.mlabels span{position:absolute;top:0;white-space:nowrap}
.mlabels .mn{transform:translateX(-100%);padding-right:6px}
.mlabels .gl{right:0}
.timer{display:flex;align-items:center;gap:10px;margin-left:auto}
.timer .tv{font:700 1.05rem var(--display);font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:6px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.status{margin:12px 0 0;font-weight:500}
.hint{margin:6px 0 0;color:var(--ink2);font-size:.9rem}

.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);text-align:left;width:100%}
.check i{flex:none;width:22px;height:22px;border:2px solid var(--ink);border-radius:5px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem}
.check[aria-pressed="true"] i{background:var(--ink);color:var(--paper)}
.check[aria-pressed="true"] span{text-decoration:line-through;text-decoration-color:var(--ink2)}
.holrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:.92rem}
.holrow input{width:20px;height:20px;accent-color:var(--cpp)}
textarea{width:100%;min-height:84px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);padding:10px 12px;font:inherit}
label.l{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}

.cal{display:grid;gap:6px}
.crow{display:grid;grid-template-columns:2.4rem repeat(7,1fr);gap:6px;align-items:stretch}
.cw{display:flex;align-items:center;font:700 .85rem var(--display);color:var(--ink2)}
.cell{position:relative;min-height:48px;aspect-ratio:1;border:1px solid var(--line);border-radius:4px;background:var(--card);padding:0;font:700 1.05rem var(--display);display:grid;place-items:center;color:var(--ink)}
.cell.wk{background:var(--wkend)}
.cell .wd,.cell .mo{position:absolute;top:3px;font:500 .62rem var(--body);color:var(--ink2)}
.cell .wd{left:4px}.cell .mo{right:4px}
.cell.part{background-image:linear-gradient(to top,var(--cpp-soft) var(--f),transparent var(--f))}
.cell.done{background:var(--cpp);border-color:var(--cpp);color:var(--on)}
.cell.done .wd,.cell.done .mo{color:var(--on);opacity:.8}
.cell.miss{border-style:dashed}
.cell.hol::after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--hl);border:1.5px solid #111B33}
.cell.today{outline:3px solid var(--ink);outline-offset:1px}
.cell.sel{box-shadow:inset 0 0 0 3px var(--math)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:.82rem;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:3px;border:1px solid var(--line);display:inline-block}

details.week{background:var(--card);border:1px solid var(--line);border-radius:6px}
details.week+details.week{margin-top:8px}
details.week summary{list-style:none;display:flex;gap:12px;align-items:baseline;padding:12px 14px;cursor:pointer}
details.week summary::-webkit-details-marker{display:none}
.wn{font:700 1rem var(--display)}
.wr{color:var(--ink2);font-size:.85rem}
.wp{margin-left:auto;font-size:.85rem;font-weight:600}
.wb{padding:0 14px 14px}
.wb p{margin:0}.wb p+p{margin-top:6px}
details.week.cur{border:2px solid var(--ink)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:.82rem}

.foot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;font-size:.88rem;color:var(--ink2)}
.foot input[type=date]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.foot .grow{flex:1 1 100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>91 days of C++ and programming maths</h1>
    <p class="sub">Ten problems every day. Weekdays 2 to 4 hours, weekends 3 to 6 hours, holidays a full day.</p>
  </header>
  <dl class="stats" id="stats"></dl>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-act="tab" data-v="today">Today</button>
    <button role="tab" data-act="tab" data-v="cal">Calendar</button>
    <button role="tab" data-act="tab" data-v="plan">Roadmap</button>
  </nav>
  <main id="app"></main>
  <footer class="foot" id="foot"></footer>
</div>

<script>
const KEY='cppmaths-tracker-v1';
const PLAN_DAYS=91;
const TYPES={
  weekday:{name:'Weekday',min:2,goal:4,range:'2 to 4 h',tip:'Concept for 45 minutes, problems for the rest, then 15 minutes noting what went wrong.'},
  weekend:{name:'Weekend',min:3,goal:6,range:'3 to 6 h',tip:'One timed set of 10 in the morning, then redo every miss and read ahead.'},
  holiday:{name:'Holiday',min:6,goal:8,range:'full day, 6 to 8 h',tip:'Two timed sets, one longer problem, and a revision pass over the whole week.'}
};
const WEEKS=[
  {c:'Setup, cin/cout, variables and types, if/else, loops, switch',m:'Parity, divisibility rules, remainders, number representation'},
  {c:'Functions, arrays, 2D arrays, strings',m:'GCD and LCM with Euclid, factors, primality check up to sqrt(n)'},
  {c:'Pointers, references, structs, pair, sort with comparators',m:'Sieve of Eratosthenes, prime factorisation, modular arithmetic'},
  {c:'STL: vector, set, map, unordered_map, stack, queue',m:'Fast power, modular exponentiation, modular inverse, nCr mod p'},
  {c:'Recursion, backtracking, subsets and permutations',m:'Induction, recurrences, Fibonacci, sum formulas'},
  {c:'Binary search, two pointers, prefix sums, sliding window',m:'Arithmetic and geometric series, bit tricks, XOR properties'},
  {c:'Classes, constructors, encapsulation, operator overloading, const',m:'Permutations, combinations, Pascal triangle, stars and bars'},
  {c:'Sorting algorithms, time complexity, greedy methods',m:"Euler's totient, Chinese remainder theorem, extended Euclid"},
  {c:'Linked list, stack and queue from scratch, binary trees, BST, smart pointers',m:'Probability, expected value, counting principles'},
  {c:'Graphs: adjacency lists, BFS, DFS, shortest path basics',m:'Graph theory: degrees, trees, connectivity, bipartite graphs'},
  {c:'Dynamic programming: 1D, knapsack, LIS, LCS',m:'Inclusion-exclusion, counting with DP, Catalan numbers'},
  {c:'STL algorithms, lambdas, templates, bitset, priority_queue',m:'Matrices, matrix exponentiation, basic geometry'},
  {c:'Revision of weak topics, three timed mock contests, one mini project',m:'Pigeonhole principle, mixed revision, review of your error log'}
];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WDN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)}
function diff(a,b){return Math.round((parse(a)-parse(b))/864e5)}
function todayStr(){return fmt(new Date())}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtH(x){return Number(x.toFixed(2))+' h'}
function short(s){const d=parse(s);return MON[d.getMonth()]+' '+d.getDate()}

let S={start:todayStr(),days:{},sel:null,tab:'today'};
try{
  const raw=localStorage.getItem(KEY);
  if(raw){const o=JSON.parse(raw);if(o&&o.start)S.start=o.start;if(o&&o.days)S.days=o.days;}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({start:S.start,days:S.days}))}catch(e){}}
function clampSel(d){const i=diff(d,S.start);if(i<0)return S.start;if(i>=PLAN_DAYS)return addDays(S.start,PLAN_DAYS-1);return d}
S.sel=clampSel(todayStr());
save();

function blank(){return {p:0,h:0,hol:false,a:false,v:false,n:''}}
function get(d){return S.days[d]||blank()}
function edit(d){if(!S.days[d])S.days[d]=blank();return S.days[d]}
function typeOf(d){const r=get(d);if(r.hol)return 'holiday';const w=parse(d).getDay();return (w===0||w===6)?'weekend':'weekday'}
function isDone(d){const r=S.days[d];if(!r)return false;return r.p>=10&&r.h>=TYPES[typeOf(d)].min}

let resetArm=false;
let T={on:false,start:0,iv:null};
function fmtT(ms){const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
function tick(){const e=document.getElementById('tval');if(e&&T.on)e.textContent=fmtT(Date.now()-T.start)}

function renderStats(){
  let dd=0,pp=0,hh=0;
  for(let i=0;i<PLAN_DAYS;i++){
    const d=addDays(S.start,i);const r=S.days[d];
    if(r){pp+=r.p;hh+=r.h}
    if(isDone(d))dd++;
  }
  let cur=clampSel(todayStr());
  if(!isDone(cur))cur=addDays(cur,-1);
  let st=0;
  while(diff(cur,S.start)>=0&&isDone(cur)){st++;cur=addDays(cur,-1)}
  document.getElementById('stats').innerHTML=
    '<div class="streak"><dt>Streak</dt><dd><span>'+st+'</span> <small>'+(st===1?'day':'days')+'</small></dd></div>'+
    '<div><dt>Days done</dt><dd>'+dd+' <small>of 91</small></dd></div>'+
    '<div><dt>Problems</dt><dd>'+pp+' <small>of 910</small></dd></div>'+
    '<div><dt>Study time</dt><dd>'+Number(hh.toFixed(1))+' <small>hours</small></dd></div>';
}

function statusText(r,t){
  const need=Math.max(0,t.min-r.h),left=Math.max(0,t.goal-r.h),pl=10-r.p;
  if(r.p>=10&&r.h>=t.min)return 'Day complete.'+(left>0?' '+fmtH(left)+' more reaches the goal if you have it in you.':' Goal hit too.');
  const parts=[];
  if(pl>0)parts.push(pl+(pl===1?' problem':' problems')+' left');
  if(need>0)parts.push(fmtH(need)+' more to hit the minimum');
  return parts.join(', ');
}

function renderToday(){
  const d=S.sel,i=diff(d,S.start),r=get(d),ty=typeOf(d),t=TYPES[ty];
  const wk=WEEKS[Math.floor(i/7)];
  const dt=parse(d),isToday=d===todayStr();
  let rows='';
  for(let g=0;g<2;g++){
    const k=g===0?'cpp':'math';
    let dots='';
    for(let j=1;j<=5;j++){
      const n=g*5+j,on=n<=r.p;
      dots+='<button class="dot '+k+(on?' on':'')+'" data-act="prob" data-n="'+n+'" aria-pressed="'+on+'" aria-label="Problem '+n+', '+(g===0?'C++':'maths')+'">'+n+'</button>';
    }
    rows+='<div class="prow"><span class="plabel '+k+'">'+(g===0?'C++':'Maths')+'</span>'+dots+'</div>';
  }
  const pct=Math.min(r.h/t.goal,1)*100,minPct=t.min/t.goal*100;
  const timer=(isToday||T.on)?
    '<div class="timer"><span class="tv" id="tval">'+(T.on?fmtT(Date.now()-T.start):'0:00:00')+'</span>'+
    (T.on?'<button class="btn solid" data-act="tstop">Stop and add</button>':'<button class="btn" data-act="tstart">Start timer</button>')+'</div>':'';
  return '<div class="stack">'+
  '<section class="card main">'+
    '<div class="dayhead"><div><h2>Day '+(i+1)+' of 91</h2>'+
      '<p><span class="chip'+(ty==='holiday'?' hol':'')+'">'+t.name+'</span>'+WDN[dt.getDay()]+', '+short(d)+(isToday?' (today)':'')+'</p></div>'+
      '<div class="nav"><button data-act="prev" aria-label="Previous day"'+(i<=0?' disabled':'')+'>&#8592;</button><button data-act="next" aria-label="Next day"'+(i>=PLAN_DAYS-1?' disabled':'')+'>&#8594;</button></div></div>'+
    (isToday?'':'<p class="hint"><button class="btn" data-act="jumptoday">Jump to today</button></p>')+
    '<div class="focus"><p><span class="tag cpp">C++</span>'+esc(wk.c)+'</p><p><span class="tag math">Maths</span>'+esc(wk.m)+'</p></div>'+
    '<div class="ph"><h2>Problems solved</h2><span class="count">'+r.p+' <small>of 10</small></span></div>'+
    rows+
    '<p class="hint">Tap a circle to log up to that problem. Tap the last filled one to undo it.</p>'+
  '</section>'+
  '<section class="card">'+
    '<div class="ph"><h2>Study time</h2><span class="count">'+fmtH(r.h)+' <small>target '+t.range+'</small></span></div>'+
    '<div class="hours"><div class="step"><button data-act="hdec" aria-label="Remove half an hour">&#8722;</button><output>'+Number(r.h.toFixed(2))+'</output><button data-act="hinc" aria-label="Add half an hour">+</button></div>'+timer+'</div>'+
    '<div class="meter" role="img" aria-label="'+fmtH(r.h)+' of '+fmtH(t.goal)+' goal"><div class="fill'+(r.h>=t.min?' ok':'')+'" style="width:'+pct+'%"></div><span class="tick" style="left:'+minPct+'%"></span></div>'+
    '<div class="mlabels"><span class="mn" style="left:'+minPct+'%">min '+fmtH(t.min)+'</span><span class="gl">goal '+fmtH(t.goal)+'</span></div>'+
    '<p class="status">'+statusText(r,t)+'</p>'+
    '<p class="hint">'+t.tip+'</p>'+
    '<label class="holrow"><input type="checkbox" data-act="hol"'+(r.hol?' checked':'')+'> Holiday, so plan a full day</label>'+
  '</section>'+
  '<section class="card"><h2>Habits</h2><div class="checks">'+
    '<button class="check" data-act="chk" data-k="a" aria-pressed="'+r.a+'"><i>'+(r.a?'&#10003;':'')+'</i><span>Studied the topic before solving</span></button>'+
    '<button class="check" data-act="chk" data-k="v" aria-pressed="'+r.v+'"><i>'+(r.v?'&#10003;':'')+'</i><span>Redid yesterday\'s wrong problems</span></button>'+
  '</div></section>'+
  '<section class="card"><label class="l" for="note">What went wrong or what clicked today</label><textarea id="note" placeholder="Example: forgot long long in the factorial problem, overflowed at n = 21.">'+esc(r.n)+'</textarea></section>'+
  '</div>';
}

function renderCal(){
  const today=todayStr();
  let h='<div class="card"><div class="cal">';
  for(let w=0;w<13;w++){
    h+='<div class="crow"><div class="cw" title="'+esc(WEEKS[w].c)+'">W'+(w+1)+'</div>';
    for(let j=0;j<7;j++){
      const idx=w*7+j,d=addDays(S.start,idx),dt=parse(d),r=S.days[d];
      const dn=isDone(d),part=!dn&&r&&(r.p>0||r.h>0),miss=!dn&&!part&&d<today;
      const wkend=(dt.getDay()===0||dt.getDay()===6);
      let cls='cell'+(wkend?' wk':'')+(dn?' done':'')+(part?' part':'')+(miss?' miss':'')+(r&&r.hol?' hol':'')+(d===today?' today':'')+(d===S.sel?' sel':'');
      const f=part?(r.p*10)+'%':'0%';
      h+='<button class="'+cls+'" style="--f:'+f+'" data-act="goday" data-d="'+d+'" aria-label="Day '+(idx+1)+', '+WDN[dt.getDay()]+' '+short(d)+(dn?', done':'')+'">'+
        '<span class="wd">'+WDN[dt.getDay()].charAt(0)+'</span>'+
        ((idx===0||dt.getDate()===1)?'<span class="mo">'+MON[dt.getMonth()]+'</span>':'')+
        dt.getDate()+'</button>';
    }
    h+='</div>';
  }
  h+='</div><div class="legend">'+
    '<span><i class="sw" style="background:var(--cpp);border-color:var(--cpp)"></i>Done</span>'+
    '<span><i class="sw" style="background:linear-gradient(to top,var(--cpp-soft) 50%,var(--card) 50%)"></i>In progress</span>'+
    '<span><i class="sw" style="border-style:dashed"></i>Missed</span>'+
    '<span><i class="sw" style="background:var(--wkend)"></i>Weekend</span>'+
    '<span><i class="sw" style="background:var(--hl);border-radius:50%"></i>Holiday</span>'+
  '</div></div>';
  return h;
}

function renderPlan(){
  const curW=Math.floor(diff(clampSel(todayStr()),S.start)/7);
  let h='<div class="card" style="margin-bottom:16px"><h2>Daily rules</h2><table>'+
    '<tr><th>Day type</th><th>Minimum</th><th>Aim for</th></tr>'+
    '<tr><td>Weekday</td><td>2 h</td><td>3 to 4 h</td></tr>'+
    '<tr><td>Saturday and Sunday</td><td>3 h</td><td>6 h</td></tr>'+
    '<tr><td>Holiday (tick it on that day)</td><td>6 h</td><td>Full day, 6 to 8 h</td></tr></table>'+
    '<p class="hint">A day counts as done when all 10 problems are logged (5 C++ and 5 maths) and you reach the minimum hours for that day type.</p></div>';
  for(let w=0;w<13;w++){
    let n=0;for(let j=0;j<7;j++){if(isDone(addDays(S.start,w*7+j)))n++}
    h+='<details class="week'+(w===curW?' cur open':'')+'"><summary><span class="wn">Week '+(w+1)+'</span><span class="wr">'+short(addDays(S.start,w*7))+' to '+short(addDays(S.start,w*7+6))+'</span><span class="wp">'+n+'/7 done</span></summary>'+
      '<div class="wb"><p><span class="tag cpp">C++</span>'+esc(WEEKS[w].c)+'</p><p><span class="tag math">Maths</span>'+esc(WEEKS[w].m)+'</p></div></details>';
  }
  return h;
}

function renderFoot(){
  document.getElementById('foot').innerHTML=
    '<label>Day 1 is <input type="date" id="startd" value="'+S.start+'"></label>'+
    '<button class="btn'+(resetArm?' danger':'')+'" data-act="reset">'+(resetArm?'Click again to erase all progress':'Reset progress')+'</button>'+
    '<span class="grow">Progress is saved in this browser only, so use the same browser and device each day.</span>';
}

function render(){
  renderStats();
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',String(b.dataset.v===S.tab))});
  const app=document.getElementById('app');
  app.innerHTML=S.tab==='today'?renderToday():S.tab==='cal'?renderCal():renderPlan();
  renderFoot();
}

document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT')return;
  const a=b.dataset.act;
  if(a!=='reset'&&resetArm)resetArm=false;
  if(a==='tab'){S.tab=b.dataset.v}
  else if(a==='prob'){const n=+b.dataset.n,r=edit(S.sel);r.p=(r.p===n)?n-1:n;save()}
  else if(a==='hinc'){const r=edit(S.sel);r.h=Math.min(16,r.h+0.5);save()}
  else if(a==='hdec'){const r=edit(S.sel);r.h=Math.max(0,r.h-0.5);save()}
  else if(a==='chk'){const r=edit(S.sel);r[b.dataset.k]=!r[b.dataset.k];save()}
  else if(a==='prev'){if(diff(S.sel,S.start)>0)S.sel=addDays(S.sel,-1)}
  else if(a==='next'){if(diff(S.sel,S.start)<PLAN_DAYS-1)S.sel=addDays(S.sel,1)}
  else if(a==='jumptoday'){S.sel=clampSel(todayStr())}
  else if(a==='goday'){S.sel=b.dataset.d;S.tab='today';window.scrollTo(0,0)}
  else if(a==='tstart'){T.on=true;T.start=Date.now();clearInterval(T.iv);T.iv=setInterval(tick,1000)}
  else if(a==='tstop'){
    clearInterval(T.iv);
    const add=Math.round((Date.now()-T.start)/36e5*4)/4;
    const r=edit(S.sel);r.h=Math.min(16,Number((r.h+add).toFixed(2)));
    T.on=false;save();
  }
  else if(a==='reset'){
    if(!resetArm){resetArm=true}
    else{S.days={};resetArm=false;save()}
  }
  render();
});
document.addEventListener('change',function(e){
  const el=e.target;
  if(el.dataset&&el.dataset.act==='hol'){edit(S.sel).hol=el.checked;save();render()}
  else if(el.id==='startd'&&el.value){S.start=el.value;S.sel=clampSel(todayStr());save();render()}
});
document.addEventListener('input',function(e){
  if(e.target.id==='note'){edit(S.sel).n=e.target.value;save()}
});
render();
</script>
</body>
</html>
